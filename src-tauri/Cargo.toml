[package]
name = "koda"
version = "0.3.10"
description = "Koda — chat de código com agente local"
authors = ["Koda"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# O diagnóstico da tela de Ajustes volta como JSON para a interface.
serde = { version = "1", features = ["derive"] }

# A job object do Windows: `KILL_ON_JOB_CLOSE` é o que garante que o host e o backend
# morram junto com o app, inclusive quando o app morre no tapa (ver `src/servicos.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
# Binário menor: o app é uma casca fina, não precisa de símbolos de debug.
strip = true
lto = true
codegen-units = 1
